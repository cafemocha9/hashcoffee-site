<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<!-- アプリを入れている人には Safari 上部に「開く」バナーを出す -->
<meta name="apple-itunes-app" content="app-id=6762002751">
<title>#coffee</title>
<link rel="icon" href="/images/icon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fafaf8; --ink: #141210; --ink-soft: #3a3631; --ink-mute: #8a837a;
    --rule: rgba(20,18,15,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141210; --ink: #fafaf8; --ink-soft: #d8d3cc; --ink-mute: #a39b90; --rule: rgba(250,250,248,0.12); }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px 16px; text-align: center; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 360px; }
  img { width: 96px; height: 96px; border-radius: 22px; border: 1px solid var(--rule); }
  h1 { font-size: 22px; font-weight: 600; margin: 20px 0 10px; }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--ink); font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
  }
  p { font-size: 15px; color: var(--ink-soft); }
  .lead { margin-top: 16px; color: var(--ink); font-weight: 600; }
  .detail { margin-top: 12px; font-size: 14px; }
  .btn {
    display: inline-block; margin-top: 28px; padding: 14px 28px; min-height: 44px;
    border-radius: 999px; background: var(--ink); color: var(--bg);
    font-size: 15px; font-weight: 600; text-decoration: none;
  }
  .note { margin-top: 20px; font-size: 13px; color: var(--ink-mute); }
</style>
</head>
<body>
<main>
  <img src="/images/icon.png" alt="">
  <h1>#coffee</h1>
  <span class="badge" id="badge">iPhone・iPad 用アプリ</span>
  <p class="lead" id="lead">#coffee（旧名：Coffee Palette）は iPhone・iPad で使えるコーヒー記録アプリです。Android 版はありません。</p>
  <p class="detail" id="detail">このQRコードには、ロースター・産地・フレーバーなどのコーヒーの情報がそのまま入っています。そのため、読み取ったときのURLが長くなっています。</p>
  <a class="btn" id="dl" href="https://apps.apple.com/app/id6762002751">App Store で見る</a>
  <p class="note" id="note">iPhone・iPad をお持ちの方は、App Store からアプリを入れて、もう一度このQRコードを読み取ってください。</p>
</main>
<script>
  // コーヒーの情報は URL の # 以降に入っており、サーバーには送られない。
  // このページはそれを読まず、App Store へ案内するだけ
  if (!/^ja\b/i.test(navigator.language || '')) {
    document.documentElement.lang = 'en';
    var en = {
      badge: 'For iPhone and iPad',
      lead: '#coffee (formerly Coffee Palette) is a coffee journal app for iPhone and iPad. It is not available for Android.',
      detail: 'This QR code contains the coffee details \u2014 roaster, origin, flavors and more \u2014 which is why the link is so long.',
      dl: 'View on the App Store',
      note: 'If you have an iPhone or iPad, install the app from the App Store and scan this QR code again.'
    };
    for (var id in en) document.getElementById(id).textContent = en[id];
  } else {
    // Android・PC のブラウザ（Web 版 App Store）は国の指定がないと米国ストア（英語）になる。
    // 日本語の端末では日本のストアのページを開く。
    // iPhone・iPad は App Store アプリが自分のアカウントの国で開くので、下の自動移動は国を指定しない
    document.getElementById('dl').href = 'https://apps.apple.com/jp/app/id6762002751';
  }
  // アプリが入っていれば iOS がここに来る前にアプリを開く。
  // ここに来たのは未インストールの iPhone なので、App Store へそのまま移る。
  // Android・PC ではこのページを表示したままにする（iPhone・iPad 用で Android 版がないことを伝える）
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) location.replace('https://apps.apple.com/app/id6762002751');
</script>
</body>
</html>
